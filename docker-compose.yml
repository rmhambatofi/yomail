services:
  mysql:
    image: mysql:8.4
    container_name: yomail-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: yomail
      MYSQL_USER: yomail
      MYSQL_PASSWORD: yomail
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_allowed_packet=16M
    ports:
      - '${YOMAIL_MYSQL_PORT:-3307}:3306'
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
